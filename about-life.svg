<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="title desc">
<title id="title">BakarCipher — Security pillars and cybersecurity journey</title>
<desc id="desc">An animated two-column dashboard showing four security competencies and three rotating journey highlights.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d36"/><stop offset="1" stop-color="#070b16"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#247bff" stop-opacity=".19"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5775a5" stroke-opacity=".09"/></pattern>
 <clipPath id="leftClip"><rect x="32" y="30" width="936" height="380" rx="20"/></clipPath>
 <style>
 text{font-family:Inter,'Segoe UI',Arial,sans-serif} .mono{font-family:'Fira Code',Consolas,monospace} .muted{fill:#9baecb} .white{fill:#f4f8ff} .panel{fill:#0d172b;stroke:#31486c;stroke-width:1} .small{font-size:12px} .slide{opacity:0} .s1{animation:s1 15s infinite}.s2{animation:s2 15s infinite}.s3{animation:s3 15s infinite}
 @keyframes s1{0%,29%{opacity:1}33%,96%{opacity:0}100%{opacity:1}} @keyframes s2{0%,32%{opacity:0}34%,62%{opacity:1}67%,100%{opacity:0}} @keyframes s3{0%,65%{opacity:0}68%,96%{opacity:1}100%{opacity:0}}
 .p1{animation:p1 15s linear infinite}.p2{animation:p2 15s linear infinite}.p3{animation:p3 15s linear infinite}
 @keyframes p1{0%{transform:scaleX(0)}31%{transform:scaleX(1)}100%{transform:scaleX(1)}} @keyframes p2{0%,33%{transform:scaleX(0)}64%{transform:scaleX(1)}100%{transform:scaleX(1)}} @keyframes p3{0%,66%{transform:scaleX(0)}97%,100%{transform:scaleX(1)}}
 .pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}} .scan{animation:scan 9s linear infinite}@keyframes scan{0%{transform:translateY(-420px)}100%{transform:translateY(440px)}}
 @media(prefers-reduced-motion:reduce){.slide,.pulse,.scan,.p1,.p2,.p3{animation:none!important}.s1{opacity:1!important}.s2,.s3{opacity:0!important}.p1{transform:scaleX(1)!important}}
 </style>
</defs>
<rect x="1" y="1" width="998" height="438" rx="24" fill="url(#bg)" stroke="#29476f" stroke-width="2"/>
<g clip-path="url(#leftClip)"><rect width="1000" height="440" fill="url(#grid)"/><circle cx="160" cy="80" r="270" fill="url(#glow)"/><circle cx="860" cy="350" r="300" fill="url(#glow)"/><rect class="scan" x="0" y="0" width="1000" height="1" fill="#247bff" opacity=".12"/></g>
<path d="M500 42V397" stroke="#39577f" stroke-dasharray="4 7" opacity=".55"/>
<text x="42" y="52" class="mono" font-size="11" fill="#4a9cff" letter-spacing="2">BAKARCIPHER / DEFENSIVE ARSENAL</text>
<text x="42" y="85" class="white" font-size="27" font-weight="750">Core Security Pillars</text>
<text x="42" y="108" class="muted" font-size="12">Hands-on labs • practical tools • security engineering</text>
<!-- Four competencies -->
<g transform="translate(42 129)">
 <rect class="panel" width="420" height="57" rx="11"/><rect x="0" width="3" height="57" rx="2" fill="#247bff"/><circle cx="29" cy="28" r="16" fill="#247bff" fill-opacity=".14"/><path d="M22 28l5 5 10-11" stroke="#65a6ff" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="56" y="24" class="white" font-size="14" font-weight="700">Intrusion Detection &amp; SOC</text><text x="56" y="42" class="muted" font-size="11.5">Snort rules • Wazuh alerts • incident triage</text>
</g>
<g transform="translate(42 196)">
 <rect class="panel" width="420" height="57" rx="11"/><rect x="0" width="3" height="57" rx="2" fill="#38d9bf"/><circle cx="29" cy="28" r="16" fill="#38d9bf" fill-opacity=".13"/><path d="M17 30h7l4-9 5 16 4-7h5" stroke="#38d9bf" stroke-width="2" fill="none" stroke-linejoin="round"/><text x="56" y="24" class="white" font-size="14" font-weight="700">Network Analysis &amp; Recon</text><text x="56" y="42" class="muted" font-size="11.5">Wireshark • Nmap • tcpdump • traffic analysis</text>
</g>
<g transform="translate(42 263)">
 <rect class="panel" width="420" height="57" rx="11"/><rect x="0" width="3" height="57" rx="2" fill="#b69aff"/><circle cx="29" cy="28" r="16" fill="#b69aff" fill-opacity=".13"/><path d="M29 16l11 5v8c0 7-5 11-11 14-6-3-11-7-11-14v-8z" transform="translate(0 -3) scale(1 .88)" stroke="#b69aff" stroke-width="2" fill="none"/><text x="56" y="24" class="white" font-size="14" font-weight="700">Threat Hunting &amp; Response</text><text x="56" y="42" class="muted" font-size="11.5">ThreatHunt • SentinelSIEM • EndpointGuard</text>
</g>
<g transform="translate(42 330)">
 <rect class="panel" width="420" height="57" rx="11"/><rect x="0" width="3" height="57" rx="2" fill="#ff6b7d"/><circle cx="29" cy="28" r="16" fill="#ff6b7d" fill-opacity=".13"/><rect x="21" y="22" width="16" height="14" rx="2" stroke="#ff6b7d" stroke-width="2" fill="none"/><path d="M25 22v-4h8v4M25 28h8" stroke="#ff6b7d" stroke-width="2"/><text x="56" y="24" class="white" font-size="14" font-weight="700">Digital Forensics &amp; Evidence</text><text x="56" y="42" class="muted" font-size="11.5">DiskTrace • MemoryScope • EvidenceVault</text>
</g>
<!-- Right column -->
<text x="537" y="52" class="mono" font-size="11" fill="#ff657b" letter-spacing="2">THE JOURNEY / BEYOND THE CONSOLE</text>
<text x="537" y="85" class="white" font-size="27" font-weight="750">Learning. Building. Defending.</text>
<text x="537" y="108" class="muted" font-size="12">The experiences shaping my cybersecurity path</text>
<!-- Progress tracks -->
<g transform="translate(537 129)"><rect width="127" height="4" rx="2" fill="#263753"/><rect x="139" width="127" height="4" rx="2" fill="#263753"/><rect x="278" width="127" height="4" rx="2" fill="#263753"/><g fill="url(#accent)"><rect class="p1" width="127" height="4" rx="2" style="transform-origin:0 0"/><rect class="p2" x="139" width="127" height="4" rx="2" style="transform-origin:139px 0"/><rect class="p3" x="278" width="127" height="4" rx="2" style="transform-origin:278px 0"/></g></g>
<g transform="translate(537 149)">
 <rect class="panel" width="420" height="238" rx="15"/>
 <g class="slide s1"><rect x="20" y="20" width="133" height="25" rx="7" fill="#247bff" fill-opacity=".16"/><text x="32" y="37" class="mono" fill="#75b4ff" font-size="11" font-weight="700">01 / FIELD LABS</text><circle class="pulse" cx="370" cy="34" r="7" fill="#38d9bf"/><text x="20" y="83" class="white" font-size="22" font-weight="700">From Theory to Practice</text><text x="20" y="114" class="muted" font-size="13">Building confidence through Kali Linux,</text><text x="20" y="135" class="muted" font-size="13">Snort detection rules, firewall testing,</text><text x="20" y="156" class="muted" font-size="13">network captures and controlled labs.</text><path d="M20 182H400" stroke="#304566"/><text x="20" y="208" class="mono" font-size="11" fill="#75b4ff">LEARN → TEST → ANALYZE → IMPROVE</text></g>
 <g class="slide s2"><rect x="20" y="20" width="157" height="25" rx="7" fill="#b69aff" fill-opacity=".16"/><text x="32" y="37" class="mono" fill="#c5afff" font-size="11" font-weight="700">02 / BUILDING TOOLS</text><circle class="pulse" cx="370" cy="34" r="7" fill="#b69aff"/><text x="20" y="83" class="white" font-size="22" font-weight="700">The BakarCipher Projects</text><text x="20" y="114" class="muted" font-size="13">Turning ideas into security prototypes:</text><text x="20" y="135" class="muted" font-size="13">ReconX, WebSentinel, SentinelSIEM,</text><text x="20" y="156" class="muted" font-size="13">ThreatOrchestrator and forensic tools.</text><path d="M20 182H400" stroke="#304566"/><text x="20" y="208" class="mono" font-size="11" fill="#c5afff">DESIGN → CODE → VALIDATE → DOCUMENT</text></g>
 <g class="slide s3"><rect x="20" y="20" width="162" height="25" rx="7" fill="#ff657b" fill-opacity=".16"/><text x="32" y="37" class="mono" fill="#ff8899" font-size="11" font-weight="700">03 / CAREER MISSION</text><circle class="pulse" cx="370" cy="34" r="7" fill="#ff657b"/><text x="20" y="83" class="white" font-size="22" font-weight="700">Growing Into a Defender</text><text x="20" y="114" class="muted" font-size="13">BS Cyber Security at Riphah, paired</text><text x="20" y="135" class="muted" font-size="13">with SOC and ethical-hacking training.</text><text x="20" y="156" class="muted" font-size="13">Focused on practical, responsible security.</text><path d="M20 182H400" stroke="#304566"/><text x="20" y="208" class="mono" font-size="11" fill="#ff8899">CURIOUS MIND. DEFENSIVE MISSION.</text></g>
</g>
<text x="43" y="419" class="mono" font-size="10" fill="#6f89ad">BAKARCIPHER // SECURITY PORTFOLIO</text>
<text x="958" y="419" class="mono" font-size="10" fill="#6f89ad" text-anchor="end">BUILT THROUGH HANDS-ON LEARNING</text>
</svg>
