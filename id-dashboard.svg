<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" fill="none">
  <defs>
    <linearGradient id="idCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="metalClipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Holographic Rainbow Foil Sweep -->
    <linearGradient id="holoSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#247bff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="idBadgeClip">
      <rect x="0" y="0" width="280" height="340" rx="18"/>
    </clipPath>

    <clipPath id="idPhotoClip">
      <rect x="0" y="0" width="105" height="125" rx="10"/>
    </clipPath>

    <style>
      @media (prefers-reduced-motion: reduce) {
        .lanyard-rig { animation: none !important; transform: rotate(0deg) !important; }
        .holo-light { animation: none !important; }
      }

      .id-font-mono { font-family: 'Fira Code', Consolas, monospace; }
      .id-font-sans { font-family: 'Inter', -apple-system, sans-serif; }
      .id-font-display { font-family: 'Space Grotesk', -apple-system, sans-serif; }

      /* Realistic Lanyard Pendulum Physics:
         Drop in from top (0s to 1.8s) with damped oscillation, 
         settling into steady gentle +/- 1.7 degree natural sway */
      @keyframes pendulumDropAndSway {
        0% { transform: translateY(-160px) rotate(-14deg); }
        15% { transform: translateY(0px) rotate(11deg); }
        30% { transform: translateY(0px) rotate(-7deg); }
        45% { transform: translateY(0px) rotate(4.5deg); }
        60% { transform: translateY(0px) rotate(-2.5deg); }
        75% { transform: translateY(0px) rotate(1.7deg); }
        87% { transform: translateY(0px) rotate(-1.7deg); }
        100% { transform: translateY(0px) rotate(1.7deg); }
      }

      @keyframes continuousGentleSway {
        0%, 100% { transform: rotate(-1.7deg); }
        50% { transform: rotate(1.7deg); }
      }

      .lanyard-rig {
        transform-origin: 430px 0px;
        animation: pendulumDropAndSway 4s cubic-bezier(0.25, 1, 0.5, 1) 0s 1 normal forwards,
                   continuousGentleSway 6s ease-in-out 4s infinite alternate;
      }

      /* Holographic foil sweep */
      @keyframes holoSweepAnim {
        0% { transform: translateX(-350px) rotate(35deg); }
        35% { transform: translateX(350px) rotate(35deg); }
        100% { transform: translateX(350px) rotate(35deg); }
      }
      .holo-light { animation: holoSweepAnim 7s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="1" y="1" width="858" height="418" rx="24" fill="#070b16"/>
  <rect x="1" y="1" width="858" height="418" rx="24" fill="none" stroke="rgba(36,123,255,0.25)" stroke-width="1.8"/>

  <!-- Background Data Grid Accents -->
  <g opacity="0.3" transform="translate(60, 40)">
    <text x="0" y="30" fill="#247bff" class="id-font-mono" font-size="11">NODE_TELEMETRY: ACTIVE</text>
    <text x="0" y="50" fill="#8b949e" class="id-font-mono" font-size="10">SECURITY CLEARANCE: TIER-1 LEAD</text>
    <text x="0" y="70" fill="#8b949e" class="id-font-mono" font-size="10">RAWALPINDI HUB // 0x42_CIPHER</text>
  </g>
  <g opacity="0.3" transform="translate(650, 40)">
    <text x="0" y="30" fill="#247bff" class="id-font-mono" font-size="11">SOC_DISPATCH: OPERATIONAL</text>
    <text x="0" y="50" fill="#8b949e" class="id-font-mono" font-size="10">INTRUSION DETECT: RUNNING</text>
    <text x="0" y="70" fill="#8b949e" class="id-font-mono" font-size="10">ENCRYPTION: AES-256-GCM</text>
  </g>

  <!-- ================= LANYARD SUSPENSION RIG ================= -->
  <g class="lanyard-rig">
    
    <!-- Heavy Woven Strap (Disappears above top border) -->
    <path d="M414 0 L414 48 L446 48 L446 0 Z" fill="url(#lanyardRibbon)"/>
    <path d="M416 0 L416 48" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 2"/>
    <path d="M444 0 L444 48" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 2"/>

    <!-- Metallic Carabiner / Clasp Assembly -->
    <g transform="translate(415, 46)">
      <!-- Top Metal Loop -->
      <rect x="6" y="0" width="18" height="12" rx="3" fill="url(#metalClipGrad)" stroke="#334155" stroke-width="1"/>
      <rect x="9" y="3" width="12" height="6" rx="2" fill="#070b16"/>
      
      <!-- Swivel Joint -->
      <rect x="11" y="11" width="8" height="6" rx="2" fill="url(#metalClipGrad)"/>
      
      <!-- Carabiner Clasp Body -->
      <path d="M8 17 C4 17 4 33 15 33 C26 33 26 17 22 17" fill="none" stroke="url(#metalClipGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="8" y1="21" x2="22" y2="21" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>

    <!-- Badge Punch-Hole Slot in Card Header -->
    <g transform="translate(290, 80)">
      
      <!-- Drop Shadow of Badge Card -->
      <rect x="-3" y="-3" width="286" height="346" rx="20" fill="#000000" fill-opacity="0.6"/>

      <!-- BADGE CARD BASE -->
      <g clip-path="url(#idBadgeClip)">
        <rect x="0" y="0" width="280" height="340" fill="url(#idCardBg)"/>
        
        <!-- Perimeter Glowing Hairline -->
        <rect x="1" y="1" width="278" height="338" rx="17" fill="none" stroke="rgba(36,123,255,0.4)" stroke-width="1.5"/>

        <!-- Top Header Strip -->
        <rect x="0" y="0" width="280" height="42" fill="#111a33"/>
        <line x1="0" y1="42" x2="280" y2="42" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>

        <!-- Badge Clip Punch Hole -->
        <rect x="115" y="8" width="50" height="8" rx="4" fill="#070b16" stroke="#475569" stroke-width="1"/>

        <!-- Header Title -->
        <text x="140" y="33" fill="#ffffff" class="id-font-mono" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.12em">
          DEFENSIVE OPERATIONS PASS
        </text>

        <!-- Portrait Frame -->
        <g transform="translate(20, 56)">
          <rect x="-2" y="-2" width="109" height="129" rx="12" fill="#070b16" stroke="#247bff" stroke-width="1.5"/>
          <image href="data:image/svg+xml;utf8,%0A%20%20%20%20%20%20%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20300%20380%22%3E%0A%20%20%20%20%20%20%20%20%3Cdefs%3E%0A%20%20%20%20%20%20%20%20%20%20%3ClinearGradient%20id%3D%22pGrad%22%20x1%3D%220%25%22%20y1%3D%220%25%22%20x2%3D%22100%25%22%20y2%3D%22100%25%22%3E%0A%20%20%20%20%20%20%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23247bff%22%20stop-opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23ff354f%22%20stop-opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%20%20%20%20%20%20%3CclipPath%20id%3D%22avatarCut%22%3E%0A%20%20%20%20%20%20%20%20%20%20%20%20%3Ccircle%20cx%3D%22150%22%20cy%3D%22180%22%20r%3D%22130%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3C%2FclipPath%3E%0A%20%20%20%20%20%20%20%20%3C%2Fdefs%3E%0A%20%20%20%20%20%20%20%20%3C!--%20Stylized%20high-fidelity%20representation%20of%20Malik%20Abubakar%20Ali%20with%20characteristic%20hoodie%20%26%20wavy%20hair%20--%3E%0A%20%20%20%20%20%20%20%20%3Cg%20clip-path%3D%22url(%23avatarCut)%22%3E%0A%20%20%20%20%20%20%20%20%20%20%3Crect%20width%3D%22300%22%20height%3D%22380%22%20fill%3D%22%230c142c%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3C!--%20Background%20Cyber%20Glows%20--%3E%0A%20%20%20%20%20%20%20%20%20%20%3Ccircle%20cx%3D%2290%22%20cy%3D%22110%22%20r%3D%2290%22%20fill%3D%22%23247bff%22%20opacity%3D%220.3%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3Ccircle%20cx%3D%22210%22%20cy%3D%22200%22%20r%3D%2290%22%20fill%3D%22%23ff354f%22%20opacity%3D%220.25%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3C!--%20Body%20%26%20Hoodie%20--%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M50%20380%20C60%20300%2080%20250%20150%20250%20C220%20250%20240%20300%20250%20380%20Z%22%20fill%3D%22%23141a29%22%2F%3E%0A%20%20%20%20%20%20%20%20%20%20%3Cpath%20d%3D%22M90%20260%20C110%20230%20190%20230%20210%20260%20L200%203