<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">BakarCipher — Cybersecurity Journey</title>
<desc id="desc">Animated operator identity badge and cybersecurity journey featuring Abubakar Ali, Riphah International University, security labs and BakarCipher projects.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e39"/><stop offset=".55" stop-color="#080f20"/><stop offset="1" stop-color="#060b17"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#172849"/><stop offset="1" stop-color="#0a1225"/></linearGradient>
  <linearGradient id="blue" x2="1"><stop stop-color="#247bff"/><stop offset=".5" stop-color="#57e2ff"/><stop offset="1" stop-color="#8d6bff"/></linearGradient>
  <linearGradient id="metal" x2="1"><stop stop-color="#64748b"/><stop offset=".4" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
  <linearGradient id="shine" x2="1"><stop stop-color="#57e2ff" stop-opacity="0"/><stop offset=".5" stop-color="#57e2ff" stop-opacity=".16"/><stop offset="1" stop-color="#57e2ff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#58a6ff" stroke-opacity=".08"/></pattern>
  <clipPath id="badgeClip"><rect width="310" height="444" rx="19"/></clipPath>
  <style>
    .mono{font-family:'Fira Code',Consolas,monospace}.sans{font-family:Inter,Arial,sans-serif}.display{font-family:'Space Grotesk',Inter,Arial,sans-serif}
    .muted{fill:#91a3bd}.white{fill:#f3f8ff}.cyan{fill:#57e2ff}.green{fill:#46e6a1}
    @keyframes enter{0%{transform:translateY(-145px) rotate(-12deg)}20%{transform:translateY(0) rotate(9deg)}45%{transform:rotate(-5deg)}70%{transform:rotate(2deg)}100%{transform:rotate(0)}}
    @keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.3deg)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes scan{0%{transform:translateY(-240px)}100%{transform:translateY(600px)}}
    @keyframes dash{to{stroke-dashoffset:-36}}
    .rig{transform-origin:256px 0;animation:enter 2.2s ease-out both,sway 5s ease-in-out 2.2s infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}.scan{animation:scan 9s linear infinite}.path{stroke-dasharray:5 7;animation:dash 3s linear infinite}
    @media(prefers-reduced-motion:reduce){.rig,.pulse,.scan,.path{animation:none!important}}
  </style>
</defs>
<!-- Stage -->
<rect x="1" y="1" width="1098" height="618" rx="25" fill="url(#bg)" stroke="#254c7d" stroke-opacity=".7" stroke-width="2"/>
<rect x="2" y="2" width="1096" height="616" rx="24" fill="url(#grid)"/>
<circle cx="1020" cy="75" r="210" stroke="#247bff" stroke-opacity=".09" stroke-width="65"/>
<circle cx="100" cy="590" r="160" stroke="#57e2ff" stroke-opacity=".08" stroke-width="55"/>
<text x="38" y="39" class="mono cyan" font-size="12" letter-spacing="2">BAKARCIPHER // PERSONAL SECURITY PORTFOLIO</text>
<text x="1060" y="39" text-anchor="end" class="mono muted" font-size="11">BUILD • BREAK • DEFEND • LEARN</text>
<path d="M36 53H1064" stroke="#3a669a" stroke-opacity=".45"/>
<!-- Hanging badge -->
<g class="rig">
  <path d="M244 -8V84H268V-8" fill="#1d4fb4" stroke="#65caff" stroke-opacity=".5" stroke-width="2"/>
  <path d="M250 0V84M262 0V84" stroke="#d5ecff" stroke-opacity=".25" stroke-dasharray="3 5"/>
  <rect x="247" y="80" width="18" height="22" rx="5" fill="url(#metal)"/>
  <rect x="252" y="85" width="8" height="9" rx="3" fill="#17243a"/>
  <path d="M250 101C240 113 247 129 256 129S272 113 262 101" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(101 126)">
    <rect x="5" y="7" width="310" height="444" rx="19" fill="#000" opacity=".48"/>
    <g clip-path="url(#badgeClip)">
      <rect width="310" height="444" fill="url(#card)"/>
      <rect width="310" height="52" fill="#142747"/>
      <path d="M0 52H310" stroke="url(#blue)" stroke-width="2"/>
      <rect x="129" y="9" width="52" height="8" rx="4" fill="#07101e" stroke="#607a9c"/>
      <text x="155" y="38" text-anchor="middle" class="mono white" font-size="11" font-weight="700" letter-spacing="1.4">CYBER OPERATOR ID</text>
      <!-- Portrait illustration, not a photograph -->
      <g transform="translate(19 72)">
        <rect width="119" height="142" rx="11" fill="#0a1831" stroke="#4f9bff" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="47" fill="#183b65"/>
        <path d="M10 142Q18 101 60 101T109 142" fill="#131b30" stroke="#398ee9" stroke-width="2"/>
        <path d="M35 109Q29 83 38 58Q48 32 60 32Q78 32 86 58Q94 83 85 109L60 130Z" fill="#263a59"/>
        <ellipse cx="60" cy="75" rx="24" ry="32" fill="#c68f70"/>
        <path d="M36 69Q28 28 61 28Q96 28 84 70Q77 50 64 48Q49 57 36 69" fill="#101624"/>
        <path d="M45 90Q60 108 75 90Q70 116 60 115Q50 115 45 90" fill="#20202b"/>
        <path d="M49 74H54M67 74H72" stroke="#101624" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="8" y="119" width="103" height="17" rx="4" fill="#07111f" opacity=".9"/>
        <text x="59" y="131" text-anchor="middle" class="mono green" font-size="8.5">LEARNING IN PUBLIC</text>
      </g>
      <g transform="translate(151 80)">
        <text class="mono muted" font-size="9">OPERATOR</text>
        <text y="20" class="display white" font-size="17" font-weight="700">ABUBAKAR</text>
        <text y="39" class="display white" font-size="17" font-weight="700">ALI</text>
        <text y="65" class="mono muted" font-size="9">CALLSIGN</text>
        <text y="83" class="mono cyan" font-size="13" font-weight="700">BakarCipher</text>
        <text y="108" class="mono muted" font-size="9">FOCUS</text>
        <text y="125" class="sans white" font-size="10">Blue • Red • DFIR</text>
      </g>
      <rect x="19" y="230" width="272" height="66" rx="9" fill="#091629" stroke="#315b8a"/>
      <text x="31" y="247" class="mono muted" font-size="9">ACADEMIC BASE</text>
      <text x="31" y="265" class="sans white" font-size="12" font-weight="700">Riphah International University</text>
      <text x="31" y="281" class="mono cyan" font-size="10">BS CYBER SECURITY • PAKISTAN</text>
      <text x="20" y="322" class="mono muted" font-size="9">PRACTICAL DOMAINS</text>
      <g class="mono" font-size="9" text-anchor="middle">
        <rect x="19" y="331" width="81" height="26" rx="6" fill="#123e50" stroke="#2caac0"/><text x="59" y="348" fill="#aaf6ff">SOC / SIEM</text>
        <rect x="108" y="331" width="83" height="26" rx="6" fill="#40213a" stroke="#c66592"/><text x="149" y="348" fill="#ffd2e6">PENTEST</text>
        <rect x="199" y="331" width="92" height="26" rx="6" fill="#302b53" stroke="#8d80e9"/><text x="245" y="348" fill="#ddd6ff">FORENSICS</text>
      </g>
      <path d="M19 374H291" stroke="#42658e" stroke-opacity=".6"/>
      <text x="20" y="392" class="mono muted" font-size="9">PROJECT LAB</text>
      <text x="20" y="409" class="mono white" font-size="11" font-weight="700">BAKARCIPHER / BUILDER</text>
      <circle cx="280" cy="400" r="5" fill="#46e6a1" class="pulse"/>
      <text x="20" y="430" class="mono muted" font-size="8">PORTFOLIO ID • NOT AN ACCESS CREDENTIAL</text>
      <rect x="-80" y="-150" width="110" height="700" fill="url(#shine)" transform="rotate(25 140 220)" class="scan"/>
    </g>
    <rect x=".8" y=".8" width="308.4" height="442.4" rx="18" stroke="#499bff" stroke-opacity=".7" stroke-width="1.6"/>
  </g>
</g>
<!-- Journey panel -->
<g transform="translate(454 91)">
  <text class="mono cyan" font-size="12" letter-spacing="2">// THE JOURNEY SO FAR</text>
  <text y="45" class="display white" font-size="35" font-weight="800">From Curiosity</text>
  <text y="86" class="display" font-size="35" font-weight="800" fill="#57e2ff">to Cyber Defense.</text>
  <text y="117" class="sans" fill="#b5c5dc" font-size="14">A student, a builder, and a hands-on security learner.</text>
  <path d="M18 155V397" stroke="#32679d" stroke-width="2" class="path"/>
  <g class="sans">
    <circle cx="18" cy="164" r="7" fill="#57e2ff"/><text x="42" y="164" class="mono cyan" font-size="11">01 / FOUNDATION</text>
    <text x="42" y="186" class="white" font-size="15" font-weight="700">Networking, Linux &amp; security fundamentals</text>
    <text x="42" y="205" class="muted" font-size="12">Packet Tracer • Wireshark • Kali Linux • VMware</text>
    <circle cx="18" cy="242" r="7" fill="#8d80e9"/><text x="42" y="242" class="mono" fill="#b3a9ff" font-size="11">02 / HANDS-ON LABS</text>
    <text x="42" y="264" class="white" font-size="15" font-weight="700">Detection, hardening &amp; ethical testing</text>
    <text x="42" y="283" class="muted" font-size="12">Snort • Wazuh • Nessus • Nmap • iptables</text>
    <circle cx="18" cy="320" r="7" fill="#46e6a1"/><text x="42" y="320" class="mono green" font-size="11">03 / BUILDING BAKARCIPHER</text>
    <text x="42" y="342" class="white" font-size="15" font-weight="700">Turning learning into working tools</text>
    <text x="42" y="361" class="muted" font-size="12">ReconX • SentinelSIEM • EndpointGuard • DiskTrace</text>
    <circle cx="18" cy="398" r="7" fill="#ffb86c"/><text x="42" y="398" class="mono" fill="#ffb86c" font-size="11">04 / THE NEXT CHAPTER</text>
    <text x="42" y="420" class="white" font-size="15" font-weight="700">SOC, threat hunting &amp; continuous growth</text>
    <text x="42" y="439" class="muted" font-size="12">Learning through practice, evidence, and iteration</text>
  </g>
</g>
<path d="M454 564H1056" stroke="#3b5e8b" stroke-opacity=".55"/>
<text x="454" y="587" class="mono" fill="#a2b5ce" font-size="11">MISSION: UNDERSTAND THE ATTACK. STRENGTHEN THE DEFENSE.</text>
<text x="1056" y="587" text-anchor="end" class="mono cyan" font-size="11">#BAKARCIPHER</text>
</svg>
