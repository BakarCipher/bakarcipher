<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 340" width="860" height="340" fill="none">
  <defs>
    <!-- Background styling and glows -->
    <linearGradient id="hBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#247bff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ff354f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1224"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <linearGradient id="hNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2edff"/>
      <stop offset="100%" stop-color="#247bff"/>
    </linearGradient>

    <!-- Rising text mask reveal for name -->
    <clipPath id="hNameClip">
      <rect x="50" y="80" width="540" height="70">
        <animate attributeName="height" values="0;70;70" keyTimes="0;0.25;1" dur="4s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Portrait Clip Area -->
    <clipPath id="hAvatarClip">
      <rect x="0" y="0" width="190" height="250" rx="20"/>
    </clipPath>

    <!-- Dot Pattern -->
    <pattern id="hDotMatrix" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#247bff" fill-opacity="0.12"/>
    </pattern>

    <style>
      @media (prefers-reduced-motion: reduce) {
        .anim-element { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
      
      .h-font-mono { font-family: 'Fira Code', 'SF Mono', Consolas, monospace; }
      .h-font-display { font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
      .h-font-sans { font-family: 'Inter', -apple-system, sans-serif; }

      /* Cycling 4 Roles */
      @keyframes roleCycle {
        0%, 20% { opacity: 1; transform: translateY(0px); }
        25%, 95% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes roleCycle2 {
        0%, 20% { opacity: 0; transform: translateY(8px); }
        25%, 45% { opacity: 1; transform: translateY(0px); }
        50%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes roleCycle3 {
        0%, 45% { opacity: 0; transform: translateY(8px); }
        50%, 70% { opacity: 1; transform: translateY(0px); }
        75%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes roleCycle4 {
        0%, 70% { opacity: 0; transform: translateY(8px); }
        75%, 95% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      .role-1 { animation: roleCycle 12s infinite; }
      .role-2 { animation: roleCycle2 12s infinite; }
      .role-3 { animation: roleCycle3 12s infinite; }
      .role-4 { animation: roleCycle4 12s infinite; }

      /* Blinking cursor */
      @keyframes blinkCursor {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }

      /* Scanner sweep line */
      @keyframes sweepScan {
        0% { transform: translateY(-10px); opacity: 0; }
        15% { opacity: 0.7; }
        50% { transform: translateY(250px); opacity: 0.7; }
        55% { opacity: 0; }
        100% { transform: translateY(-10px); opacity: 0; }
      }
      .scanner-line { animation: sweepScan 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background with Gradient Border -->
  <rect x="1" y="1" width="858" height="338" rx="24" fill="url(#hBgGrad)"/>
  <rect x="1" y="1" width="858" height="338" rx="24" fill="url(#hDotMatrix)"/>
  <rect x="1" y="1" width="858" height="338" rx="24" fill="none" stroke="url(#hBorderGrad)" stroke-width="1.8"/>

  <!-- Subtle Corner Circuit Accents -->
  <path d="M25 40 L45 40 L55 50" stroke="#247bff" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <circle cx="25" cy="40" r="2.5" fill="#247bff" fill-opacity="0.6"/>
  <path d="M835 300 L815 300 L805 290" stroke="#ff354f" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <circle cx="835" cy="300" r="2.5" fill="#ff354f" fill-opacity="0.6"/>

  <!-- Left Content Area -->
  <g transform="translate(0, 0)">
    <!-- Terminal prompt typed greeting -->
    <g transform="translate(50, 52)">
      <rect x="-8" y="-14" width="280" height="26" rx="6" fill="#070b16" stroke="#247bff" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="2" cy="-1" r="3" fill="#ff354f"/>
      <circle cx="12" cy="-1" r="3" fill="#ffbd2e"/>
      <circle cx="22" cy="-1" r="3" fill="#28c840"/>
      <text x="36" y="3" fill="#247bff" class="h-font-mono" font-size="12" font-weight="600">root@bakarcipher:~$</text>
      <text x="180" y="3" fill="#e6edf3" class="h-font-mono" font-size="12">whoami</text>
      <rect x="238" y="-7" width="7" height="14" fill="#247bff" class="cursor-blink"/>
    </g>

    <!-- Oversized Display Name Reveal with Rising Mask -->
    <g clip-path="url(#hNameClip)">
      <text x="50" y="138" fill="url(#hNameGrad)" class="h-font-display" font-size="44" font-weight="800">
        MALIK ABUBAKAR ALI
      </text>
    </g>

    <!-- 4 Cycling Roles -->
    <g transform="translate(50, 175)">
      <text x="0" y="0" fill="#247bff" class="h-font-mono" font-size="15" font-weight="600">❯</text>
      <!-- Role 1 -->
      <g class="role-1 anim-element">
        <text x="22" y="0" fill="#247bff" class="h-font-mono" font-size="15" font-weight="600">Cybersecurity Analyst</text>
        <text x="225" y="0" fill="#8b949e" class="h-font-mono" font-size="12">· Incident Triage &amp; Threat Defense</text>
      </g>
      <!-- Role 2 -->
      <g class="role-2 anim-element">
        <text x="22" y="0" fill="#ff354f" class="h-font-mono" font-size="15" font-weight="600">SOC Analyst</text>
        <text x="145" y="0" fill="#8b949e" class="h-font-mono" font-size="12">· SIEM Monitoring &amp; Forensic Correlation</text>
      </g>
      <!-- Role 3 -->
      <g class="role-3 anim-element">
        <text x="22" y="0" fill="#38ef7d" class="h-font-mono" font-size="15" font-weight="600">Network Defense Specialist</text>
        <text x="268" y="0" fill="#8b949e" class="h-font-mono" font-size="12">· Snort &amp; Packet Inspection</text>
      </g>
      <!-- Role 4 -->
      <g class="role-4 anim-element">
        <text x="22" y="0" fill="#a78bfa" class="h-font-mono" font-size="15" font-weight="600">Secure Backend Developer</text>
        <text x="245" y="0" fill="#8b949e" class="h-font-mono" font-size="12">· Python, FastAPI &amp; AES-GCM</text>
      </g>
    </g>

    <!-- One-line pitch -->
    <text x="50" y="214" fill="#8b949e" class="h-font-sans" font-size="13" font-weight="400">
      Cyber security scholar &amp; operations team lead passionate about defensive engineering,
    </text>
    <text x="50" y="233" fill="#8b949e" class="h-font-sans" font-size="13" font-weight="400">
      packet-level telemetry, and resilient zero-trust application architectures.
    </text>

    <!-- Company & Location Row -->
    <g transform="translate(50, 276)">
      <!-- Company badge -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-16" width="292" height="28" rx="8" fill="#11182c" stroke="#247bff" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M14 -2 L20 -8 L26 -2 L20 4 Z" fill="#247bff"/>
        <text x="34" y="2" fill="#e6edf3" class="h-font-sans" font-size="11.5" font-weight="500">
          Team Lead @ Ace Solutions · Riphah Scholar
        </text>
      </g>
      <!-- Location badge -->
      <g transform="translate(304, 0)">
        <rect x="0" y="-16" width="138" height="28" rx="8" fill="#11182c" stroke="#247bff" stroke-width="1" stroke-opacity="0.35"/>
        <path d="M12 -4 C12 -8 18 -8 18 -4 C18 0 15 3 15 3 C15 3 12 0 12 -4 Z" fill="#ff354f"/>
        <circle cx="15" cy="-4" r="1.5" fill="#ffffff"/>
        <text x="26" y="2" fill="#8b949e" class="h-font-sans" font-size="11.5">Rawalpindi, PK</text>
      </g>
      <!-- Status pulse -->
      <g transform="translate(454, 0)">
        <rect x="0" y="-16" width="105" height="28" rx="8" fill="#11182c" stroke="#28c840" stroke-width="1" stroke-opacity="0.35"/>
        <circle cx="14" cy="-2" r="3.5" fill="#28c840">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="25" y="2" fill="#28c840" class="h-font-mono" font-size="10.5" font-weight="600">DEFENDING</text>
      </g>
    </g>
  </g>

  <!-- Right Portrait Frame with Glowing Cybernetic Glass -->
  <g transform="translate(620, 45)">
    <!-- Shadow Card -->
    <rect x="-4" y="-4" width="198" height="258" rx="24" fill="#060913" stroke="url(#hBorderGrad)" stroke-width="2"/>
    
    <!-- Image with Clipping linking to uploaded id.png.png -->
    <g clip-path="url(#hAvatarClip)">
      <rect x="0" y="0" width="190" height="250" fill="#0c142c"/>
      <image href="https://raw.githubusercontent.com/BakarCipher/bakarcipher/main/id.png.png" xlink:href="https://raw.githubusercontent.com/BakarCipher/bakarcipher/main/id.png.png" x="0" y="0" width="190" height="250" preserveAspectRatio="xMidYMid slice"/>
    </g>
    
    <!-- Cybernetic HUD Overlay -->
    <g opacity="0.6">
      <rect x="8" y="8" width="10" height="10" fill="none" stroke="#247bff" stroke-width="2"/>
      <rect x="172" y="8" width="10" height="10" fill="none" stroke="#247bff" stroke-width="2"/>
      <rect x="8" y="232" width="10" height="10" fill="none" stroke="#ff354f" stroke-width="2"/>
      <rect x="172" y="232" width="10" height="10" fill="none" stroke="#ff354f" stroke-width="2"/>
    </g>

    <!-- Laser Grid Scanner Sweep Line -->
    <line x1="0" y1="0" x2="190" y2="0" stroke="#247bff" stroke-width="2" opacity="0.8" class="scanner-line"/>

    <!-- Bottom ID Stamp -->
    <rect x="25" y="215" width="140" height="20" rx="4" fill="#070b16" fill-opacity="0.85" stroke="#247bff" stroke-width="0.8"/>
    <text x="95" y="229" fill="#247bff" class="h-font-mono" font-size="9" font-weight="600" text-anchor="middle">AUTH_ID: #BC-0924</text>
  </g>
</svg>
